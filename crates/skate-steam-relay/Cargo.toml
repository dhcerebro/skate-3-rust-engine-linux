[package]
name = "skate-steam-relay"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate-steam-relay"
path = "src/main.rs"

[features]
# Default is a stub that refuses to start. Windows packaging must pass
# `--features steam` explicitly if a relay is required.
default = []
steam = ["dep:steamworks"]

[dependencies]
steamworks = { version = "=0.13.1", features = ["raw-bindings"], optional = true }
skate-net = { path = "../skate-net" }
